<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic Keyframe Animations -->
    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.6; }
      }
      @keyframes floatData {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes waveLine {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      @keyframes barGrow1 {
        0%, 100% { height: 90px; y: 270px; }
        50% { height: 140px; y: 220px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 150px; y: 210px; }
        50% { height: 100px; y: 260px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 180px; y: 180px; }
        50% { height: 210px; y: 150px; }
      }
      @keyframes barGrow4 {
        0%, 100% { height: 120px; y: 240px; }
        50% { height: 170px; y: 190px; }
      }
      .orb-anim { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: center; }
      .float-anim { animation: floatData 6s ease-in-out infinite; }
      .bar-1 { animation: barGrow1 4s ease-in-out infinite; }
      .bar-2 { animation: barGrow2 4.5s ease-in-out infinite; }
      .bar-3 { animation: barGrow3 5s ease-in-out infinite; }
      .bar-4 { animation: barGrow4 3.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Background Animated Glowing Orbs (Behind everything) -->
  <circle cx="150" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" class="orb-anim" opacity="0.25" />
  <circle cx="1050" cy="280" r="180" fill="#818cf8" filter="url(#glow)" class="orb-anim" opacity="0.2" />
  <circle cx="900" cy="90" r="120" fill="#c084fc" filter="url(#glow)" class="orb-anim" opacity="0.15" />

  <!-- Subtle Chart Background Art (Right side, behind text) -->
  <g opacity="0.85" transform="translate(680, 40)">
    <!-- Chart axes -->
    <line x1="40" y1="310" x2="480" y2="310" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="40" y1="230" x2="480" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="40" y1="150" x2="480" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    
    <!-- Animated Chart Bars -->
    <rect x="70" y="220" width="36" height="90" rx="6" fill="url(#barGrad1)" class="bar-1" />
    <rect x="130" y="210" width="36" height="100" rx="6" fill="url(#barGrad2)" class="bar-2" />
    <rect x="190" y="180" width="36" height="130" rx="6" fill="url(#barGrad3)" class="bar-3" />
    <rect x="250" y="240" width="36" height="70" rx="6" fill="url(#barGrad1)" class="bar-4" />
    <rect x="310" y="160" width="36" height="150" rx="6" fill="url(#barGrad2)" class="bar-3" />
    <rect x="370" y="130" width="36" height="180" rx="6" fill="url(#barGrad3)" class="bar-1" />
    <rect x="430" y="190" width="36" height="120" rx="6" fill="url(#barGrad2)" class="bar-4" />

    <!-- Trend Line Flow -->
    <path d="M 88 230 Q 148 180, 208 190 T 328 140 T 448 110" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" filter="url(#glow)" />
    <circle cx="88" cy="230" r="5" fill="#38bdf8" />
    <circle cx="208" cy="190" r="5" fill="#818cf8" />
    <circle cx="328" cy="140" r="5" fill="#c084fc" />
    <circle cx="448" cy="110" r="5" fill="#f43f5e" />
  </g>

  <!-- Foreground Title and Content (Strictly in foreground and crystal clear) -->
  <g transform="translate(70, 70)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="16" cy="16" r="6" fill="#38bdf8" />
    <text x="32" y="21" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CURATED DATA ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="82" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Data Visualization
    </text>
    <text x="0" y="130" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; Charting Libraries
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      The definitive index of enterprise BI SaaS, self-hosted analytics, and open-source charting engines.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 210)" class="float-anim">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 BI Platforms</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="156" y="22" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📈 Charting Engines</text>

      <!-- Tag 3 -->
      <rect x="314" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="328" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Open-Source Web</text>

      <!-- Tag 4 -->
      <rect x="486" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="500" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔒 Self-Hosted BI</text>
    </g>
  </g>
</svg>
